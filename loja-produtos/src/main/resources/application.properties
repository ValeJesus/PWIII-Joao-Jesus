spring.application.name=loja-produtos

# Conexão com o Banco de Dados (PostgreSQL)
# O banco "ProdutosJava" precisa existir antes de iniciar a aplicação.
spring.datasource.url=jdbc:postgresql://localhost:5432/ProdutosJava
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate: cria/atualiza as tabelas automaticamente a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
